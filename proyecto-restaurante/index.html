<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabores Restaurant</title><link rel="stylesheet" href="style.css"></head>
<body>
<section id="login" class="login"><div class="box"><div class="logo">🍽️</div><h1>Sabores</h1><p>Restaurant ordering system</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><small>Demo: karen / 1234</small><b id="loginMsg"></b></div></section>
<div id="app" class="hide"><header><b>🍽️ SABORES</b><button id="logout">Log out</button></header><main><section class="hero"><h2>Welcome, Karen!</h2><p>Choose your food and build your order.</p></section><div class="layout"><section><nav><button data-cat="all" class="active">All</button><button data-cat="main">Main</button><button data-cat="drink">Drinks</button><button data-cat="dessert">Desserts</button></nav><div id="menu" class="menu"></div></section><aside><h2>Your order</h2><div id="cart"></div><hr><p>Subtotal <b id="sub">$0</b></p><p>Service 5% <b id="service">$0</b></p><h2>Total <span id="total">$0</span></h2><button id="confirm">Confirm order</button><button id="clear">Clear</button><b id="msg"></b></aside></div></main></div>
<script src="script.js"></script></body></html>
